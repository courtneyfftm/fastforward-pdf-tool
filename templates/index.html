<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastForward TM - PDF File Organizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input[type="password"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="password"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }
        
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            display: block;
            padding: 15px;
            background: #f5f5f5;
            border: 2px dashed #667eea;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #667eea;
            font-weight: 500;
        }
        
        .file-input-label:hover {
            background: #f0f0ff;
        }
        
        .file-input-label.has-file {
            border-style: solid;
            background: #f0f0ff;
        }
        
        .file-name {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
            font-weight: normal;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-clear:hover {
            background: #e0e0e0;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            display: none;
        }
        
        .alert-success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
            display: none;
        }
        
        .results {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }
        
        .results-header {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .download-btn {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .download-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }
        
        .data-summary {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .data-item {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .data-item:last-child {
            border-bottom: none;
        }
        
        .data-label {
            font-weight: 600;
            color: #333;
        }
        
        .data-value {
            color: #666;
            word-break: break-word;
        }
        
        .info-text {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FastForward TM</h1>
            <p>PDF Document Organizer & Data Extractor</p>
        </div>
        
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="apiKey">Anthropic API Key</label>
                <input type="password" id="apiKey" name="api_key" placeholder="sk-ant-..." required>
                <p class="info-text">Your API key is used only locally and never stored</p>
            </div>
            
            <div class="form-group">
                <label for="pdfFile">Upload PDF Packet</label>
                <div class="file-input-wrapper">
                    <input type="file" id="pdfFile" name="pdf" accept=".pdf" required>
                    <label for="pdfFile" class="file-input-label">
                        <div>📄 Click to select or drag & drop your PDF</div>
                        <div class="file-name" id="fileName"></div>
                    </label>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-submit" id="submitBtn">Process PDF</button>
                <button type="reset" class="btn-clear" id="clearBtn">Clear</button>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your PDF...</p>
            </div>
        </form>
        
        <div class="results" id="results">
            <div class="results-header">✓ Processing Complete</div>
            <p style="margin-bottom: 15px; color: #666; font-size: 14px;">
                <strong id="docCount"></strong> documents organized and extracted
            </p>
            <a href="#" class="download-btn" id="downloadLink">📥 Download Organized PDFs</a>
            
            <div class="results-header" style="margin-top: 20px; margin-bottom: 10px;">Extracted Transaction Data</div>
            <div class="data-summary" id="dataSummary"></div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('uploadForm');
        const pdfInput = document.getElementById('pdfFile');
        const fileLabel = document.querySelector('.file-input-label');
        const fileName = document.getElementById('fileName');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const downloadLink = document.getElementById('downloadLink');
        const dataSummary = document.getElementById('dataSummary');
        const docCount = document.getElementById('docCount');
        
        // File input handling
        pdfInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileName.textContent = this.files[0].name;
                fileLabel.classList.add('has-file');
            }
        });
        
        // Drag and drop
        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.style.background = '#e8e8ff';
        });
        
        fileLabel.addEventListener('dragleave', () => {
            fileLabel.style.background = '';
        });
        
        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.style.background = '';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                pdfInput.files = files;
                pdfInput.dispatchEvent(new Event('change'));
            }
        });
        
        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                showError('Please enter your API key');
                return;
            }
            
            if (!pdfInput.files.length) {
                showError('Please select a PDF file');
                return;
            }
            
            loading.style.display = 'block';
            results.style.display = 'none';
            errorAlert.style.display = 'none';
            
            const formData = new FormData();
            formData.append('pdf', pdfInput.files[0]);
            formData.append('api_key', apiKey);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Upload failed');
                }
                
                loading.style.display = 'none';
                displayResults(data);
                
            } catch (error) {
                loading.style.display = 'none';
                showError(error.message);
            }
        });
        
        function showError(message) {
            errorAlert.textContent = '❌ ' + message;
            errorAlert.style.display = 'block';
            results.style.display = 'none';
        }
        
        function displayResults(data) {
            docCount.textContent = `${data.documents_count} documents`;
            
            // Build data summary
            let html = '';
            for (const [key, value] of Object.entries(data.transaction_data)) {
                if (value) {
                    const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    html += `
                        <div class="data-item">
                            <div class="data-label">${label}</div>
                            <div class="data-value">${value}</div>
                        </div>
                    `;
                }
            }
            
            if (!html) {
                html = '<p style="color: #999;">No structured data extracted from documents</p>';
            }
            
            dataSummary.innerHTML = html;
            
            // Setup download
            downloadLink.href = `/download/${encodeURIComponent(data.file)}`;
            
            results.style.display = 'block';
            successAlert.style.display = 'none';
        }
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            fileName.textContent = '';
            fileLabel.classList.remove('has-file');
            results.style.display = 'none';
            errorAlert.style.display = 'none';
        });
    </script>
</body>
</html>
